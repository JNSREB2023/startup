<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="index_page.css"/>
    <title>Rate My Recipe</title>
</head>
<body>
    <div class="topnav">
        <a href="index.html" class="active">Rate My Recipe</a>
    
        <!-- Hamburger menu icon -->
        <a href="javascript:void(0);" class="icon" onclick="toggleMenu()">
            <i class="fa fa-bars"></i>
        </a>
    
         <!-- Links displayed in a block for vertical layout -->
        <div id="myLinks">
            <a href="create-login.html">Create login</a>
            <a href="directory-page.html">Homepage</a>
            <a href="rating-page.html">Rate a Recipe</a>
            <a href="update-login.html">Update Login</a>
            <a href="recipe-data.html">Recipes</a>  
        </div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="row justify-content-center align-items-center">
                <div class="col-md-4 image-container">
                    <img src="https://i.pinimg.com/736x/3b/2d/1e/3b2d1e9e893a35fcd592d79ff76fde6c.jpg" alt="Image 1" class="side-image">
                </div>
                <div class="col-md-4 login-form">
                    <h2>Login</h2>
                    <form action="/login" method="POST">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required>

                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>

                        <div class="buttons">
                            <button type="button" class="btn btn-primary" onclick="location.href='directory-page.html'">Login</button>
                            <button type="button" class="btn btn-secondary" onclick="location.href='create-login.html'">Create Login</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-4 image-container">
                    <img src="https://i.pinimg.com/736x/71/b1/ea/71b1ea44afb80b4b5a7e45a1c6121d23.jpg" alt="Image 2" class="side-image">
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <a href="https://github.com/JNSREB2023/startup.git">GitHub</a>
    </footer>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
      <script>
          function toggleMenu() {
              var links = document.getElementById("myLinks");
              if (links.style.display === "block") {
                  links.style.display = "none";
              } else {
                  links.style.display = "block";
              }
          }
      </script> 
</body>
</html>
