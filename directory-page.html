<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="directory_page.css"/>
    <title>Rate My Recipe</title>
</head>
<body>
    <div class="topnav">
        <a href="index.html" class="active">Rate My Recipe</a>

        <!-- Hamburger menu icon -->
        <a href="javascript:void(0);" class="icon" onclick="toggleMenu()">
            <i class="fa fa-bars"></i>
        </a>

        <!-- Links displayed in a block for vertical layout -->
        <div id="myLinks">
            <a href="create-login.html">Create login</a>
            <a href="directory-page.html">Homepage</a>
            <a href="rating-page.html">Rate a Recipe</a>
            <a href="update-login.html">Update Login</a>
            <a href="recipe-data.html">Recipes</a>  
        </div>
    </div>

    <div class="main-content">
        <div class="recipes-container d-flex justify-content-between p-4">
            <!-- Left Section: List of Recipes -->
            <section class="recipes">
                <h2>Rate Others Recipes!</h2>
                <div class="recipe-box-container">
                    <!-- Placeholder recipe boxes -->
                    <div class="recipe-box">
                        <a href="recipe-page.html">These are placeholders for now :)</a>
                    </div>
                    <div class="recipe-box">
                        <a href="recipe-page.html">Recipe 2</a>
                    </div>
                    <div class="recipe-box">
                        <a href="recipe-page.html">Recipe 3</a>
                    </div>
                    <!-- Add more boxes as needed -->
                </div>
            </section>
    
            <!-- Right Section: Add New Recipe Form -->
            <section class="add-recipe">
                <h2>Add New Recipe</h2>
                <form action="/add-recipe" method="POST">
                    <p>
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" required>
                    </p>
                    <p><label for="ingredients">Ingredients:</label>
                        <textarea id="ingredients" name="ingredients" rows="4" required></textarea>
                    </p>
                    <label for="instructions">Instructions:</label>
                    <textarea id="instructions" name="instructions" rows="6" required></textarea>
                    <button type="submit">Add</button>
                </form>
            </section>
        </div>
    </div>
    <footer class="footer">
        <a href="https://github.com/JNSREB2023/startup.git">GitHub</a>
    </footer>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
      <script>
          function toggleMenu() {
              var links = document.getElementById("myLinks");
              if (links.style.display === "block") {
                  links.style.display = "none";
              } else {
                  links.style.display = "block";
              }
          }
      </script> 
</body>
</html>
